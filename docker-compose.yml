version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devblueprint_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: devblueprint
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d devblueprint']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: devblueprint_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/devblueprint?schema=public
      JWT_SECRET: devblueprint-production-grade-jwt-secret-key-at-least-32-chars-long
      JWT_REFRESH_SECRET: devblueprint-production-grade-refresh-secret-key-at-least-32-chars-long
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: devblueprint_web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'

volumes:
  postgres_data:

